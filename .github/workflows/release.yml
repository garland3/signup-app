name: Release

# Builds the container image for a version tag (v0.2.0, ...), checks it starts,
# scans it, pushes it to the GitHub Container Registry, and publishes a GitHub
# Release with the image as a `docker load`-able tarball.
#
# Cut a release: set `version` in pyproject.toml, merge to main, then
#   git tag v<version> && git push origin v<version>
# Re-run for an existing tag: Actions > Release > Run workflow, enter the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.2.0"
        required: true

permissions:
  contents: write   # create the release and upload its assets
  packages: write   # push to ghcr.io

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches pyproject.toml
        run: |
          case "$TAG" in v*) ;; *) echo "::error::Tag must look like v1.2.3, got $TAG"; exit 1 ;; esac
          VERSION="${TAG#v}"
          PROJECT_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $PROJECT_VERSION"
            exit 1
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "VERSION=$VERSION"
            echo "IMAGE=$IMAGE"
            echo "TARBALL=signup-app-$VERSION-linux-amd64.tar.gz"
          } >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.title=signup-app" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e PROXY_SECRET=smoke-test-secret \
            -e LITELLM_BASE_URL=http://litellm.invalid:4000 \
            -e LITELLM_ADMIN_KEY=sk-smoke-test \
            "$IMAGE:$VERSION"
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          docker logs smoke
          [ "$code" = 200 ] || { echo "::error::/api/health returned $code"; exit 1; }
          unauth=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/me)
          [ "$unauth" = 401 ] || { echo "::error::/api/me without auth returned $unauth, expected 401"; exit 1; }
          docker rm -f smoke

      - name: Scan image (Trivy, report only)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          scanners: vuln
          format: table
          output: trivy-image-report.txt
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Push to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Package image tarball
        run: |
          docker save "$IMAGE:$VERSION" | gzip -9 > "$TARBALL"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          ls -lh "$TARBALL"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Container image"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Without registry access, download \`$TARBALL\` below and load it:"
            echo
            echo '```bash'
            echo "sha256sum -c $TARBALL.sha256"
            echo "docker load -i $TARBALL"
            echo '```'
            echo
            echo "Run it (settings: \`.env.example\`):"
            echo
            echo '```bash'
            echo "docker run -p 8000:8000 --env-file .env $IMAGE:$VERSION"
            echo '```'
            echo
            echo "Built from \`$GITHUB_SHA\` on Red Hat Hardened Images (Python 3.14), linux/amd64."
            echo "The Trivy scan of this image is attached as \`trivy-image-report.txt\`."
          } > release-notes.md
          [ -s trivy-image-report.txt ] || echo "Trivy scan did not run; see the workflow log." > trivy-image-report.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" trivy-image-report.txt --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$TARBALL" "$TARBALL.sha256" trivy-image-report.txt \
              --verify-tag --title "signup-app $VERSION" --notes-file release-notes.md
          fi
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
