name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v

  # The container image runs Python 3.15 (see Dockerfile). Test on that exact
  # version too so the shipped runtime is covered by CI, not just the 3.11
  # floor above. Keep this in step with the Dockerfile's base image tag.
  test-image-python:
    name: Test (Python 3.15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.15.0

      - name: Install dependencies
        run: uv sync --extra dev --python 3.15.0

      - name: Run tests
        run: uv run --python 3.15.0 pytest tests/ -v

  # Build the container image on every PR, so a base-image or dependency
  # change that breaks it (interpreter path, missing wheels) fails here
  # instead of at release time. Same checks as the release smoke test.
  build-image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t signup-app:ci .

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e PROXY_SECRET=smoke-test-secret \
            -e LITELLM_BASE_URL=http://litellm.invalid:4000 \
            -e LITELLM_ADMIN_KEY=sk-smoke-test \
            signup-app:ci
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          docker logs smoke
          [ "$code" = 200 ] || { echo "::error::/api/health returned $code"; exit 1; }
          page=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          [ "$page" = 200 ] || { echo "::error::/ returned $page, expected 200"; exit 1; }
          unauth=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/me)
          [ "$unauth" = 401 ] || { echo "::error::/api/me without auth returned $unauth, expected 401"; exit 1; }
          docker rm -f smoke
